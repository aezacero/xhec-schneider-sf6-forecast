# Decision tool (app/): local only, no telemetry, Canvas look (monochrome, hairlines, 8px radius)

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#000000"
linkColor = "#000000"
borderColor = "#e6e6e6"
showWidgetBorder = true
baseRadius = "8px"
font = "sans-serif"
